name: Report a question
description: Tell us a writing or speaking scenario, or a reading or listening topic, you got in the TCF Canada.
title: "[Report] "
labels: ["report"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping other candidates.
        **Do not include your name, email, phone number, test centre booking details or any other personal information.** Describe only the question.
  - type: input
    id: month
    attributes:
      label: Exam month
      description: When did you sit the exam?
      placeholder: "2026-09"
    validations:
      required: true
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options:
        - Writing
        - Speaking
        - Reading
        - Listening
    validations:
      required: true
  - type: dropdown
    id: task
    attributes:
      label: Task
      description: Writing and speaking only.
      options:
        - Task 1
        - Task 2
        - Task 3
        - Not applicable (reading or listening)
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: The question or topic, in your own words
      description: French or English. Paraphrase it; do not paste copyrighted exam material.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: My report contains no personal information.
          required: true
